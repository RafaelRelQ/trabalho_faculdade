<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Manager</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="imgs/ChatGPT Image 14 de mai. de 2026, 15_07_48.png">
</head>
<body>
    <div id="cabeça">
        <div id="titulo">
            <div class="logo">
                <img id="logo" src="/imgs/ChatGPT Image 14 de mai. de 2026, 15_07_48.png">
                <h1 class="titulo1">Manager</h1>
            </div>
            <div id="searchbar">
                <input type="text" id="bar" placeholder="Search...">
                <button id="search" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <button id="profile"><i class="fa-regular fa-user"></i></button>
        </div>

        <div id="subtitulo">
            <button class="butt" id="adm">
                Administração
            </button>
            <button class="butt" id="pesq">
                Pesquisa
            </button>
            <button class="butt" id="calc">
                Calculos
            </button>
            <button class="butt" id="vend">
                Vendas
            </button>
            <button class="butt" id="outras">
                Outras
            </button>
        </div>
    </div>
    <div id="corpo">
        <div id="bodytitle">
            <p>Estas são as recomendações</p>
        </div>
        <div class="cards">
            
            <img class="card" id="chatgpt" src="/imgs/images.png">
            
            <img class="card" id="notion" src="/imgs/notion.webp">  

            <img class="card" id="mathway" src="/imgs/mathway_icon_rounded.png">

            <img class="card" id="jasper" src="/imgs/683ba90f27d44bc11e5687ea_Jasper Logo Square.svg">
            
            <img class="card" id="midjourney" src="/imgs/Midjourney_Emblem.svg.png"> 
            
            <img class="card" id="elevenlabs" src="/imgs/elevenlabs.png">
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://kit.fontawesome.com/79f62002f4.js" crossorigin="anonymous"></script>
</body>
</html>
